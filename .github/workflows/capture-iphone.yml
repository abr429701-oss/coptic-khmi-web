name: capture-iphone-demo
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web PWA
        run: |
          npx expo export -p web
          node scripts/build-pwa.mjs
          ls -la dist | head

      - name: Stage local server tree
        run: |
          mkdir -p srv/coptic-khmi-web
          cp -R dist/* srv/coptic-khmi-web/

      - name: Boot iPhone simulator and capture demo
        run: bash scripts/capture-iphone-demo.sh

      - name: Upload capture artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iphone-demo-capture
          path: capture/
          retention-days: 1