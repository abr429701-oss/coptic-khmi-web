name: capture-iphone-demo
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LIVE_URL: https://abr429701-oss.github.io/coptic-khmi-web/

jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (capture script only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Boot iPhone simulator, install PWA to Home Screen, launch, go offline
        run: bash scripts/capture-a2hs.sh

      - name: Upload capture artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iphone-demo-capture
          path: capture/
          retention-days: 1
