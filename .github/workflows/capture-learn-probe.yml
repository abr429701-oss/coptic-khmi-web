name: capture-learn-probe
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout (probe script, full history for exact staged SHA)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build staged 35f4531 and probe Learn iframe in real Safari
        run: bash scripts/capture-learn-probe.sh

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: learn-probe-capture
          path: capture/
          retention-days: 1
